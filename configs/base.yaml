data:
  images: ""
  image_size: 512
  stride: 1
  # 相机内参模式 (不依赖 config.cfg，可直接在此处配置):
  #   auto     : 自动检测 (有 config.cfg 用它；否则读 EXIF；否则退化为无内参相对尺度)
  #   provided : 使用下方 intrinsics_value [fx, fy, cx, cy]
  #   exif     : 仅从图片 EXIF 焦距估算
  #   none     : 无内参 (仅靠纯 RGB 图像运行)
  intrinsics: auto          # auto | exif | provided | none
  intrinsics_value: null    # 示例: [1220.0, 1220.0, 960.0, 540.0]
  max_frames: 0

frontend:
  backend: live                # images only: run the SLAM loop in-process
  use_calib: "auto"            # auto-use EXIF / config.cfg / provided intrinsics when available
  keyframe_policy: default
  single_thread: false

filter:
  enabled: true
  gate: true
  nfp: true
  prune: true
  min_conf: 0.0
  depth_min_m: 0.1          # live clouds are in SLAM units until a GT Sim3 is known
  depth_max_m: 1500.0
  height_min_m: -3.0
  height_max_m: 120.0
  iso_radius_m: 1.5
  iso_conf_max: 1.2
  curtain_ratio: 4.0
  max_prune_frac: 0.35
  nfp_mode: above
  nfp_tau_m: 4.0
  nfp_top_pct: 90
  nfp_min_obs: 2
  protect_unique: true
  protect_low_obs: true
  nfp_below_min_gap_m: 1.5

gaussian:
  enabled: true
  head_ckpt: ""
  keyframes_only: true
  anchor: head
  apply_filter: true
  # True streaming 3DGS per-keyframe ortho + nadir consensus
  streaming_3dgs: true
  adaptive_stride: true
  flat_stride: 1
  edge_grad_pct: 70.0
  depth_upsample: edge
  edge_rel_tau: 0.03
  edge_reject: 1
  edge_pct: 95.0
  voxel_gsd_mul: 1.0
  nadir_replace_margin: 0.15
  gsd_mul: 1.0
  max_canvas_px: 6144
  tile_halo: 16
  # Final 3DGS output (when streaming_3dgs=true, produced directly from live map;
  # when streaming_3dgs=false, runs offline P5.1c fallback)
  final_enabled: true
  gsd_3dgs: 0.0              # 0 = auto: native pixel footprint
  conf_threshold: 0.5
  blend_levels: 4
  feather_radius: 24
  max_kf: 0                  # 0 = every keyframe

map:
  cell: 0.45
  z_gap: 2.0
  max_layers: 3
  freeze_owner: true
  online_calib: true
  window: 0
  window_every: 5
  window_rounds: 2
  grid_cells: 2048
  bootstrap_kfs: 3
  progressive_align: true

ortho:
  gsd: 0.30
  tile: 512
  render: rgb
  fov_only: true
  dirty_tiles: true
  budget_ms: 500
  max_tiles: 24
  dump_every: 1
  async_worker: true
  async_dump: true
  dump_scale: 0.5
  dump_format: jpg
  dump_queue: 8
  update_on: frame
  edge_pct: 85
  edge_dilate: 2

offline:
  enabled: true
  filter: true
  carve: true
  iters: 3
  model: hybrid
  lam_p: 0.1
  render_texture: true

output:
  save_tiles: true
  save_product: true
  save_mosaic: true
  save_json: true
